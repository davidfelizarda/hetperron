<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Het Perron — Narrowcasting</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --brand-blue:#1242A8;
      --bg:#ffffff;
      --card:#ffffff;
      --border:#E6E6E6;
      --muted:#6B6B6B;
      --text:#111111;

      --pill-now:#DDEB00;
      --pill-next:#F08AD8;
      --pill-text:#111111;

      --r-xl:34px;
      --r-lg:22px;
      --r-md:16px;

      --pad:48px;

      --row-alt:#F3F4F6;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Albert Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#111;
      color:var(--text);
      overflow:hidden;
    }

    .stage{
      width:1080px;
      height:1920px;
      background:var(--bg);
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(var(--scale,1));
      transform-origin:center;
      overflow:hidden;
    }

    .screen{
      width:100%;
      height:100%;
      padding: var(--pad);
      display:none;
    }
    .screen.active{ display:block; }

    .header{
      background:var(--brand-blue);
      border-radius: var(--r-xl);
      padding:38px;
      color:#fff;
      display:grid;
      grid-template-columns: 1fr auto;
      align-items:end;
    }

    .header-left{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:12px;
    }

    .logo{
      height:50px;
      width:auto;
      max-width:520px;
      object-fit:contain;
      display:block;
    }

    .title{
      font-size:78px;
      line-height:0.95;
      font-weight:800;
      margin:0;
      white-space:nowrap;
      letter-spacing:-0.02em;
    }

    .header-right{
      text-align:right;
      font-size:28px;
      line-height:1.15;
      opacity:.95;
    }
    .header-right .date{ font-weight:800; }
    .header-right .meta{ opacity:.9; }

    .grid{
      margin-top:26px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:22px;
    }

    .room-card{
      background:var(--card);
      border:2px solid var(--border);
      border-radius: var(--r-lg);
      padding:20px;
      min-height:0;
    }

    .room-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .room-name{
      font-size:40px;
      line-height:1.05;
      font-weight:800;
      margin:0;
      letter-spacing:-0.01em;
    }

    .slot{
      border:2px solid var(--border);
      border-radius: var(--r-md);
      padding:14px 14px 16px 14px;
      margin-top:12px;
      min-height:156px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      gap:8px;
    }

    .room-card.long .slot{
      min-height:184px;
      padding-bottom:20px;
    }

    .pill{
      align-self:flex-start;
      font-weight:900;
      letter-spacing:1px;
      font-size:20px;
      padding:7px 14px;
      border-radius:999px;
      color:var(--pill-text);
      text-transform:uppercase;
    }
    .pill.now{ background:var(--pill-now); }
    .pill.next{ background:var(--pill-next); }

    .time{
      font-size:46px;
      line-height:1;
      font-weight:900;
      letter-spacing:-0.5px;
      margin:0;
    }

    .name{
      font-size:30px;
      line-height:1.12;
      color:#2B2B2B;
      margin:0;
      word-break:break-word;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow:hidden;
    }
    .name.small{ font-size:26px; }
    .name.tiny{ font-size:22px; }

    .slot.empty .pill{ opacity:.28; }
    .slot.empty .time,
    .slot.empty .name{ opacity:.22; }

    .agenda-wrap{
      margin-top:26px;
      height: 1500px;
      overflow:hidden;
      border-radius: var(--r-xl);
    }

    .agenda-list{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .agenda-row{
      display:grid;
      grid-template-columns: 240px 140px 1fr;
      gap:18px;
      padding:20px 22px;
      border:2px solid var(--border);
      border-radius: var(--r-lg);
      align-items:start;
      background:#fff;
    }

    .agenda-row.alt{
      background: var(--row-alt);
    }

    .agenda-date{
      font-size:30px;
      font-weight:900;
      letter-spacing:-0.01em;
      line-height:1.05;
      margin:0;
    }

    .agenda-time{
      font-size:30px;
      font-weight:900;
      line-height:1.05;
      margin:0;
    }

    .agenda-title{
      font-size:34px;
      font-weight:900;
      line-height:1.08;
      margin:0;
      display:-webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow:hidden;
    }

    .agenda-meta{
      margin-top:10px;
      font-size:22px;
      font-weight:900;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color: var(--brand-blue);
      opacity: .95;
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      align-items:center;
    }

    .agenda-tag{
      padding:7px 12px;
      border-radius:999px;
      border:2px solid rgba(18,66,168,.25);
      background: rgba(18,66,168,.08);
      color: var(--brand-blue);
      font-size:20px;
      font-weight:900;
      letter-spacing:0.06em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    .agenda-empty{
      color:var(--muted);
      font-size:30px;
      font-weight:700;
      padding:22px;
      border:2px dashed #D0D0D0;
      border-radius:26px;
      text-align:center;
    }

    #screen-promo{
      padding:0 !important;
      background:#000;
      position:relative;
      overflow:hidden;
    }

    .promo-media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:none;
    }

    .promo-media.active{ display:block; }

    .promo-backdrop{
      object-fit:cover;
      transform:scale(1.10);
      filter:blur(42px) brightness(.55);
      opacity:.95;
    }

    .promo-foreground{
      object-fit:cover;
      z-index:2;
    }

    #screen-promo.contain .promo-foreground{
      object-fit:contain;
    }

    #screen-promo.cover .promo-backdrop{
      display:none !important;
    }
  </style>
</head>

<body>
  <div class="stage" id="stage">

    <section class="screen active" id="screen-planning">
      <div class="header">
        <div class="header-left">
          <img class="logo" src="assets/Het Perron-Logo-Liggend-Wit.png" alt="Het Perron" />
          <h1 class="title">Zaalplanning</h1>
        </div>
        <div class="header-right">
          <div class="date" id="todayLabel">—</div>
          <div class="meta" id="pageLabel"></div>
        </div>
      </div>
      <div class="grid" id="roomsGrid"></div>
    </section>

    <section class="screen" id="screen-agenda">
      <div class="header">
        <div class="header-left">
          <img class="logo" src="assets/Het Perron-Logo-Liggend-Wit.png" alt="Het Perron" />
          <h1 class="title">Agenda</h1>
        </div>
        <div class="header-right">
          <div class="date" id="todayLabelAgenda">—</div>
        </div>
      </div>
      <div class="agenda-wrap">
        <div class="agenda-list" id="agendaList"></div>
      </div>
    </section>

    <section class="screen" id="screen-promo">
      <img id="promoBackdropImg" class="promo-media promo-backdrop" alt="" aria-hidden="true" />
      <video id="promoBackdropVideo" class="promo-media promo-backdrop" muted playsinline preload="metadata" aria-hidden="true"></video>
      <img id="promoImg" class="promo-media promo-foreground" alt="" />
      <video id="promoVideo" class="promo-media promo-foreground" muted playsinline preload="auto"></video>
    </section>

  </div>

  <script>
    // ─── CONFIG ────────────────────────────────────────────────────────────────
    // Alle instellingen op één plek zodat je nooit diep in de code hoeft te zoeken.

    const WORKER_BASE       = "https://hetperron-yesplan-proxy.davidfelizarda.workers.dev/";
    const ENDPOINT_PLANNING = WORKER_BASE + "planning";
    const ENDPOINT_AGENDA   = WORKER_BASE + "agenda";

    const ROOMS_PER_VIEW   = 6;
    const REFRESH_MS       = 2 * 60 * 1000;  // data hertrekken
    const ROOMPAGE_MS      = 12 * 1000;       // zaalrotatie
    const MAINSCREEN_MS    = 20 * 1000;       // duur zaalplanning / agenda
    const PROMO_SLIDE_MS   = 10 * 1000;       // duur per promo-slide
    const PROMOS_PER_BLOCK = 2;               // na elke 2 promo's opnieuw zaalplanning
    const WATCHDOG_MS      = 1000;            // robuuste timercheck voor Android/WebView
    const FETCH_TIMEOUT_MS = 8 * 1000;        // max wachttijd op server
    const NIGHT_RELOAD_H   = 4;               // uur voor nachtelijke reload

    const ENABLE_MAIN_ROTATION = true;

    const screens = ["screen-planning", "screen-agenda", "screen-promo"];

    const ROOM_ORDER = [
      "Stadsschouwburg",
      "Theaterzaal",
      "Polyvalente zaal",
      "Vergaderlokaal 1",
      "Vergaderlokaal 2",
      "Vergaderlokaal 3",
      "Vergaderlokaal 4",
      "Vergaderlokaal A",
      "Repetitieruimte",
    ];

    const AGENDA_PROFILES   = new Set(["E_Podium", "E_educatief"]);
    const HIDE_SCHOOL_LABEL = "schoolvoorstelling";
    const GENRES            = ["muziek","theater","theatershow","klassiek","familie","film","vorming","humor"];
    const TZ                = "Europe/Brussels";

    // ─── STATE ─────────────────────────────────────────────────────────────────

    let lastGoodPlanning = null;
    let lastGoodAgenda   = null;

    let roomsAll      = [];
    let roomPageIndex = 0;
    let roomPageTimer = null;

    let promoSlides          = [];
    let promoPrefetchPromise = null;
    let promoCursor          = 0;
    let planningNext         = "agenda";

    // Deadline-gebaseerde timers. De watchdog vergelijkt altijd met Date.now(),
    // zodat een vertraagde of gemiste setTimeout in Android TV/WebView de loop
    // niet permanent kan laten vastlopen.
    let mainDeadline   = 0;
    let mainNextFn     = null;
    let promoDeadline  = 0;
    let promoNextFn    = null;

    // ─── SCHAAL ────────────────────────────────────────────────────────────────

    function setScaleToFit() {
      const stage = document.getElementById("stage");
      const W = 1080, H = 1920;

      if (window.innerWidth >= W && window.innerHeight >= H) {
        stage.style.setProperty("--scale", "1");
        return;
      }

      const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
      stage.style.setProperty("--scale", String(scale));
    }

    // ─── DATUM / TIJD ──────────────────────────────────────────────────────────

    function capitalize(s){ return s ? s[0].toUpperCase() + s.slice(1) : s; }

    function nowInBrussels() {
      return new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
    }

    function todayISO() {
      return new Date().toLocaleDateString("en-CA", { timeZone: TZ });
    }

    function addDaysISO(dateISO, days) {
      const [y, m, d] = dateISO.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
      dt.setUTCDate(dt.getUTCDate() + days);
      return [
        dt.getUTCFullYear(),
        String(dt.getUTCMonth() + 1).padStart(2, "0"),
        String(dt.getUTCDate()).padStart(2, "0"),
      ].join("-");
    }

    function formatTodayLabel(dateObj) {
      const opts    = { timeZone: TZ };
      const weekday = dateObj.toLocaleDateString("nl-BE", { ...opts, weekday: "long" });
      const day     = dateObj.toLocaleDateString("nl-BE", { ...opts, day: "numeric" });
      const month   = dateObj.toLocaleDateString("nl-BE", { ...opts, month: "short" });
      return `${capitalize(weekday)} ${day} ${month}`;
    }

    function formatDateShortNL(dateISO) {
      // Gebruik UTC+12 noon om zomer-/wintertijdproblemen volledig te vermijden
      const [y, m, d] = dateISO.split("-").map(Number);
      const dt   = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
      const opts = { timeZone: "UTC" };
      const w    = dt.toLocaleDateString("nl-BE", { ...opts, weekday: "short" });
      const day  = dt.toLocaleDateString("nl-BE", { ...opts, day: "numeric" });
      const mon  = dt.toLocaleDateString("nl-BE", { ...opts, month: "short" });
      return `${w} ${day} ${mon}`;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&",  "&amp;")
        .replaceAll("<",  "&lt;")
        .replaceAll(">",  "&gt;")
        .replaceAll('"',  "&quot;")
        .replaceAll("'",  "&#039;");
    }

    // ─── TIJDPARSING ───────────────────────────────────────────────────────────

    function parseTimeToDate(dateISO, hhmm) {
      const [y, m, d] = dateISO.split("-").map(Number);
      const [hh, mm]  = String(hhmm).split(":").map(Number);
      const s = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")} `
              + `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}:00`;
      return new Date(new Date(s).toLocaleString("en-US", { timeZone: TZ }));
    }

    function normalizeEnd(startDate, endDate) {
      if (endDate.getTime() < startDate.getTime()) {
        const plus = new Date(endDate);
        plus.setDate(plus.getDate() + 1);
        return plus;
      }
      return endDate;
    }

    function isNowWithin(start, end, now) {
      return now >= start && now < end;
    }

    // ─── FETCH MET TIMEOUT EN FALLBACK ─────────────────────────────────────────
    // FIX: AbortController met timeout voorkomt dat de app oneindig wacht
    // bij een trage of onbereikbare server. Bij elke fout valt de functie
    // terug op de laatste succesvolle data (lastGoodPlanning / lastGoodAgenda).

    async function fetchArray(url, setLastGood, getLastGood) {
      const controller = new AbortController();
      const timeoutId  = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

      try {
        const res = await fetch(url, { cache: "no-store", signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) {
          const txt = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status}: ${txt}`);
        }

        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Non-array JSON");

        setLastGood(data);
        return data;

      } catch (e) {
        clearTimeout(timeoutId);
        // "AbortError" = timeout verstreken; andere fouten = netwerk/server
        console.warn("fetch failed:", url, e.message ?? e);
        const fallback = getLastGood();
        return fallback ?? [];
      }
    }

    // ─── ZAALPLANNING ──────────────────────────────────────────────────────────

    function mapToCanonicalRoom(locName) {
      const n = String(locName || "").toLowerCase();
      if (n === "stadsschouwburg")         return "Stadsschouwburg";
      if (n === "theaterzaal")             return "Theaterzaal";
      if (n === "polyvalente zaal")        return "Polyvalente zaal";
      if (n === "vergaderlokaal 1")        return "Vergaderlokaal 1";
      if (n === "vergaderlokaal 2")        return "Vergaderlokaal 2";
      if (n === "vergaderlokaal 3")        return "Vergaderlokaal 3";
      if (n === "vergaderlokaal 4")        return "Vergaderlokaal 4";
      if (n === "vergaderlokaal a")        return "Vergaderlokaal A";
      if (n.startsWith("repetitieruimte")) return "Repetitieruimte";
      return null;
    }

    function computeRoomPlan(items, dateISO) {
      const now    = nowInBrussels();
      const byRoom = new Map();

      for (const item of items) {
        const room = mapToCanonicalRoom(item?.Locatie?.name);
        if (!room) continue;
        if ((item?.Datum || dateISO) !== dateISO) continue;

        const name       = item?.Naam || "";
        const startLabel = item?.["Getoonde starttijd"];
        const endLabel   = item?.["Getoonde eindtijd"];
        if (!startLabel || !endLabel) continue;

        const start = parseTimeToDate(dateISO, startLabel);
        const end   = normalizeEnd(start, parseTimeToDate(dateISO, endLabel));

        if (!byRoom.has(room)) byRoom.set(room, []);
        byRoom.get(room).push({ name, start, end, startLabel, endLabel });
      }

      for (const arr of byRoom.values()) arr.sort((a, b) => a.start - b.start);

      return ROOM_ORDER.map(roomName => {
        const arr     = byRoom.get(roomName) || [];
        const current = arr.find(a => isNowWithin(a.start, a.end, now)) || null;
        const next    = arr.find(a => a.start > now) || null;
        return { roomName, current, next };
      });
    }

    function buildSlotHTML(type, activity) {
      const isEmpty   = !activity;
      const pillLabel = type === "now" ? "Nu" : "Straks";
      return `
        <div class="slot ${isEmpty ? "empty" : ""}">
          <div class="pill ${type}">${pillLabel}</div>
          <p class="time">${isEmpty ? "—" : `${escapeHtml(activity.startLabel)}–${escapeHtml(activity.endLabel)}`}</p>
          <p class="name">${isEmpty ? " " : escapeHtml(activity.name)}</p>
        </div>`;
    }

    function applyNameSizingAndLongCards(container) {
      container.querySelectorAll(".room-card").forEach(card => card.classList.remove("long"));
      container.querySelectorAll(".name").forEach(el => {
        const len  = el.textContent.trim().length;
        const card = el.closest(".room-card");
        el.classList.remove("small", "tiny");
        if (len > 70) el.classList.add("small");
        if (len > 95) { el.classList.remove("small"); el.classList.add("tiny"); }
        if (card && len > 85) card.classList.add("long");
      });
    }

    function renderRoomPage() {
      const grid       = document.getElementById("roomsGrid");
      const pageLabel  = document.getElementById("pageLabel");
      const totalPages = Math.max(1, Math.ceil(roomsAll.length / ROOMS_PER_VIEW));

      if (roomPageIndex >= totalPages) roomPageIndex = 0;

      const slice = roomsAll.slice(
        roomPageIndex * ROOMS_PER_VIEW,
        roomPageIndex * ROOMS_PER_VIEW + ROOMS_PER_VIEW
      );

      grid.innerHTML = slice.map(r => `
        <article class="room-card">
          <div class="room-head">
            <h2 class="room-name">${escapeHtml(r.roomName)}</h2>
          </div>
          ${buildSlotHTML("now",  r.current ? { startLabel: r.current.startLabel, endLabel: r.current.endLabel, name: r.current.name } : null)}
          ${buildSlotHTML("next", r.next    ? { startLabel: r.next.startLabel,    endLabel: r.next.endLabel,    name: r.next.name    } : null)}
        </article>`
      ).join("");

      applyNameSizingAndLongCards(grid);

      // Toon paginanummer alleen als er meerdere pagina's zijn
      pageLabel.textContent = totalPages > 1 ? `Pagina ${roomPageIndex + 1}/${totalPages}` : "";
    }

    function stopRoomPagination() {
      if (roomPageTimer) {
        clearInterval(roomPageTimer);
        roomPageTimer = null;
      }
    }

    function startRoomPagination() {
      stopRoomPagination();

      const totalPages = Math.ceil(roomsAll.length / ROOMS_PER_VIEW);
      if (totalPages <= 1) return;

      roomPageTimer = setInterval(() => {
        roomPageIndex = (roomPageIndex + 1) % totalPages;
        renderRoomPage();
      }, ROOMPAGE_MS);
    }

    // ─── AGENDA ────────────────────────────────────────────────────────────────

    function labelsToLowerNames(labels) {
      if (!Array.isArray(labels)) return [];
      return labels
        .map(l => (l && typeof l.name === "string") ? l.name.trim().toLowerCase() : "")
        .filter(Boolean);
    }

    function hasSchoolvoorstelling(labels) {
      return labelsToLowerNames(labels).includes(HIDE_SCHOOL_LABEL);
    }

    function pickGenres(labels) {
      const names = labelsToLowerNames(labels);
      return GENRES.filter(g => names.includes(g)).slice(0, 2);
    }

    function pickStartTime(item) {
      const t = item?.["Tijdschema's"]?.["Voorstelling"];
      if (Array.isArray(t) && t.length && t[0]?.start) return String(t[0].start);
      if (typeof item?.["Getoonde starttijd"] === "string") return item["Getoonde starttijd"];
      return "";
    }

    function agendaFilterAndSort(items) {
      const startISO = todayISO();
      const endISO   = addDaysISO(startISO, 365); // kijk maximaal 1 jaar vooruit

      return items
        .filter(it => {
          const prof    = it?.Profiel?.name || "";
          const dateISO = it?.Datum;
          return AGENDA_PROFILES.has(String(prof))
            && dateISO && typeof dateISO === "string"
            && dateISO >= startISO && dateISO <= endISO
            && !hasSchoolvoorstelling(it?.Labels)
            && it?.Naam
            && pickStartTime(it);
        })
        .map(it => ({
          dateISO:   it.Datum,
          dateLabel: formatDateShortNL(it.Datum),
          startTime: pickStartTime(it),
          name:      String(it.Naam || ""),
          genres:    pickGenres(it.Labels),
          zaal:      it?.Locatie?.name ? String(it.Locatie.name) : "",
        }))
        .sort((a, b) =>
          a.dateISO !== b.dateISO
            ? a.dateISO.localeCompare(b.dateISO)
            : a.startTime.localeCompare(b.startTime)
        );
    }

    function renderAgenda(items) {
      const wrap     = document.querySelector(".agenda-wrap");
      const list     = document.getElementById("agendaList");
      const filtered = agendaFilterAndSort(items);

      if (!filtered.length) {
        list.innerHTML = `<div class="agenda-empty">Geen komende voorstellingen gevonden.</div>`;
        return;
      }

      // Vul de beschikbare hoogte dynamisch. Zo staat er altijd het maximaal
      // mogelijke aantal voorstellingen op één agenda-pagina, ongeacht titel-lengte.
      list.innerHTML = "";

      for (let i = 0; i < filtered.length; i++) {
        const row = filtered[i];
        const tags = [
          ...row.genres.map(g => g.toUpperCase()),
          ...(row.zaal ? [row.zaal.toUpperCase()] : []),
        ];
        const tagsHtml = tags.length
          ? `<div class="agenda-meta">${tags.map(t => `<span class="agenda-tag">${escapeHtml(t)}</span>`).join("")}</div>`
          : "";

        list.insertAdjacentHTML("beforeend", `
          <div class="agenda-row ${i % 2 === 1 ? "alt" : ""}">
            <p class="agenda-date">${escapeHtml(row.dateLabel)}</p>
            <p class="agenda-time">${escapeHtml(row.startTime)}</p>
            <div>
              <p class="agenda-title">${escapeHtml(row.name)}</p>
              ${tagsHtml}
            </div>
          </div>`);

        // Zodra de nieuwste rij buiten het zichtbare kader valt, verwijderen we die weer.
        if (list.scrollHeight > wrap.clientHeight) {
          list.lastElementChild?.remove();
          break;
        }
      }
    }

    function trimAgendaToFit() {
      const wrap = document.querySelector(".agenda-wrap");
      const list = document.getElementById("agendaList");
      if (!wrap || !list || wrap.clientHeight <= 0) return;

      // Verwijder onderaan alle rijen die niet volledig binnen het zichtbare kader passen.
      while (list.lastElementChild && list.scrollHeight > wrap.clientHeight) {
        list.lastElementChild.remove();
      }
    }

    // ─── PROMO ─────────────────────────────────────────────────────────────────

    function promoIsActive(src, dateISO = todayISO()) {
      // Bestandsnaam: YYYY-MM-DD_YYYY-MM-DD_titel.png
      // Start- en einddatum zijn inclusief.
      const filename = String(src || "").split("/").pop() || "";
      const match = filename.match(/^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})_.+\.(png|jpe?g|webp|gif|mp4|webm)$/i);
      if (!match) {
        console.warn("Promo overgeslagen: ongeldige bestandsnaam", filename);
        return false;
      }

      const [, startISO, endISO] = match;
      return dateISO >= startISO && dateISO <= endISO;
    }

    async function loadPromoSlides() {
      const controller = new AbortController();
      const timeoutId  = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        const res = await fetch(`promo/promo.json?ts=${Date.now()}`, {
          cache: "no-store",
          signal: controller.signal,
        });
        clearTimeout(timeoutId);
        if (!res.ok) return [];

        const list = await res.json();
        if (!Array.isArray(list)) return [];

        const dateISO = todayISO();
        return list.filter(src => promoIsActive(src, dateISO));
      } catch (e) {
        clearTimeout(timeoutId);
        console.warn("promo.json load failed:", e.message ?? e);
        return [];
      }
    }

    function isVideoPromo(src) {
      return /\.(mp4|webm)$/i.test(String(src || ""));
    }

    function preloadPromoMedia(slides) {
      for (const src of slides) {
        if (isVideoPromo(src)) {
          const v = document.createElement("video");
          v.preload = "metadata";
          v.muted = true;
          v.src = src;
        } else {
          const im = new Image();
          im.src = src;
        }
      }
    }

    async function prefetchPromo(force = false) {
      // Bij elke datarefresh mag promo.json opnieuw worden ingelezen.
      if (force) promoPrefetchPromise = null;
      if (promoPrefetchPromise) return promoPrefetchPromise;

      promoPrefetchPromise = (async () => {
        const slides = await loadPromoSlides();
        promoSlides = slides;
        preloadPromoMedia(slides);
        return slides;
      })();

      return promoPrefetchPromise;
    }

    // ─── HOOFD-REFRESH ─────────────────────────────────────────────────────────

    async function refreshAll() {
      const today   = nowInBrussels();
      const dateISO = todayISO();

      document.getElementById("todayLabel").textContent       = formatTodayLabel(today);
      document.getElementById("todayLabelAgenda").textContent = formatTodayLabel(today);

      const planningItems = await fetchArray(
        ENDPOINT_PLANNING,
        d => { lastGoodPlanning = d; },
        ()  => lastGoodPlanning
      );
      roomsAll      = computeRoomPlan(planningItems, dateISO);
      roomPageIndex = 0;
      renderRoomPage();
      if (document.getElementById("screen-planning")?.classList.contains("active")) {
        startRoomPagination();
      }

      const agendaItems = await fetchArray(
        ENDPOINT_AGENDA,
        d => { lastGoodAgenda = d; },
        ()  => lastGoodAgenda
      );
      renderAgenda(agendaItems);

      // Promo opnieuw inlezen en alvast klaarzetten (loopt op achtergrond)
      prefetchPromo(true);
    }

    // ─── SCHERMROTATIE / ROBUUSTE LOOP ─────────────────────────────────────────

    function setActiveScreen(id) {
      screens.forEach(s =>
        document.getElementById(s).classList.toggle("active", s === id)
      );
    }

    function clearMainSchedule() {
      mainDeadline = 0;
      mainNextFn = null;
    }

    function scheduleMainRotation(fn, delay) {
      mainNextFn = fn;
      mainDeadline = Date.now() + delay;
    }

    function clearPromoSchedule() {
      promoDeadline = 0;
      promoNextFn = null;
    }

    function schedulePromoAdvance(fn, delay) {
      promoNextFn = fn;
      promoDeadline = Date.now() + delay;
    }

    function checkReliableTimers() {
      const now = Date.now();

      if (mainNextFn && mainDeadline && now >= mainDeadline) {
        const fn = mainNextFn;
        clearMainSchedule(); // eerst wissen om dubbele overgang te voorkomen
        try {
          fn();
        } catch (e) {
          console.error("Hoofdrotatie fout:", e);
          showPlanningScreen("agenda");
        }
      }

      if (promoNextFn && promoDeadline && now >= promoDeadline) {
        const fn = promoNextFn;
        clearPromoSchedule();
        try {
          fn();
        } catch (e) {
          console.error("Promo-rotatie fout:", e);
          showPlanningScreen("agenda");
        }
      }
    }

    function startRotationWatchdog() {
      setInterval(checkReliableTimers, WATCHDOG_MS);

      // Extra checks wanneer Android/WebView opnieuw actief wordt.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkReliableTimers();
      });
      window.addEventListener("focus", checkReliableTimers);
      window.addEventListener("pageshow", checkReliableTimers);
    }

    function showPlanningScreen(nextTarget = "agenda") {
      clearMainSchedule();
      clearPromoSchedule();

      planningNext = nextTarget === "promo" ? "promo" : "agenda";

      // Elke terugkeer naar zaalplanning begint opnieuw op pagina 1.
      stopRoomPagination();
      roomPageIndex = 0;
      renderRoomPage();
      setActiveScreen("screen-planning");
      startRoomPagination();

      scheduleMainRotation(
        planningNext === "promo" ? showPromoBlock : showAgendaScreen,
        MAINSCREEN_MS
      );
    }

    function showAgendaScreen() {
      clearMainSchedule();
      clearPromoSchedule();

      // Laat de zaalpagina niet verder tellen terwijl ze verborgen is.
      stopRoomPagination();
      setActiveScreen("screen-agenda");

      // De agenda wordt vaak opgebouwd terwijl het scherm nog verborgen is.
      // Meet daarom pas na het zichtbaar maken en snij exact af na de laatste volledige rij.
      requestAnimationFrame(() => {
        requestAnimationFrame(trimAgendaToFit);
      });

      // Promo's zijn normaal al geprefetcht; deze call gebruikt dezelfde Promise.
      prefetchPromo();

      // Na de agenda starten we bij de eerstvolgende promo.
      scheduleMainRotation(showPromoBlock, MAINSCREEN_MS);
    }

    async function showPromoBlock() {
      clearMainSchedule();
      clearPromoSchedule();

      // Prefetch mag nooit de volledige signage-loop blokkeren.
      // De normale fetch heeft al een timeout; deze catch is een extra vangnet.
      try {
        await prefetchPromo();
      } catch (e) {
        console.warn("Promo prefetch mislukt:", e);
      }

      // Neem een snapshot zodat een refresh midden in het blok niets verspringt.
      const slides = [...promoSlides];

      if (!slides.length) {
        promoCursor = 0;
        showPlanningScreen("agenda");
        return;
      }

      if (promoCursor >= slides.length) promoCursor = 0;

      const screen   = document.getElementById("screen-promo");
      const img      = document.getElementById("promoImg");
      const bgImg    = document.getElementById("promoBackdropImg");
      const video    = document.getElementById("promoVideo");
      const bgVideo  = document.getElementById("promoBackdropVideo");

      if (!screen || !img || !bgImg || !video || !bgVideo) {
        promoCursor = 0;
        showPlanningScreen("agenda");
        return;
      }

      setActiveScreen("screen-promo");
      let shownInBlock = 0;
      let finishing = false;

      function hideAllPromoMedia() {
        clearPromoSchedule();

        img.onload = null;
        img.onerror = null;
        video.onloadedmetadata = null;
        video.onended = null;
        video.onerror = null;

        img.classList.remove("active");
        bgImg.classList.remove("active");
        video.classList.remove("active");
        bgVideo.classList.remove("active");

        video.pause();
        bgVideo.pause();
        video.removeAttribute("src");
        bgVideo.removeAttribute("src");
        video.load();
        bgVideo.load();
      }

      function setPromoLayout(width, height) {
        const ratio = width > 0 && height > 0 ? width / height : 9 / 16;
        const target = 9 / 16;
        const isNineSixteen = Math.abs(ratio - target) <= 0.04;

        screen.classList.toggle("cover", isNineSixteen);
        screen.classList.toggle("contain", !isNineSixteen);
      }

      function finishCurrentPromo() {
        if (finishing) return;
        finishing = true;
        hideAllPromoMedia();

        const reachedEnd = promoCursor >= slides.length;
        const blockFull  = shownInBlock >= PROMOS_PER_BLOCK;

        if (reachedEnd || blockFull) {
          if (reachedEnd) {
            // Volledige promolijst gehad: na zaalplanning opnieuw Agenda tonen.
            promoCursor = 0;
            showPlanningScreen("agenda");
          } else {
            // Er zijn nog promo's: eerst opnieuw zaalplanning, daarna volgende blok.
            showPlanningScreen("promo");
          }
          return;
        }

        finishing = false;
        showNextPromo();
      }

      function showImage(src) {
        bgImg.src = src;
        img.src = src;

        img.onload = () => {
          setPromoLayout(img.naturalWidth, img.naturalHeight);
          img.classList.add("active");
          if (screen.classList.contains("contain")) bgImg.classList.add("active");
        };

        img.onerror = finishCurrentPromo;

        // Niet afhankelijk van één setTimeout: watchdog controleert deze deadline.
        schedulePromoAdvance(finishCurrentPromo, PROMO_SLIDE_MS);
      }

      function showVideo(src) {
        video.src = src;
        bgVideo.src = src;
        video.muted = true;
        bgVideo.muted = true;
        video.currentTime = 0;
        bgVideo.currentTime = 0;

        const startPlayback = async () => {
          setPromoLayout(video.videoWidth, video.videoHeight);
          video.classList.add("active");

          if (screen.classList.contains("contain")) {
            bgVideo.classList.add("active");
            try { await bgVideo.play(); } catch (e) { console.warn("Backdrop video autoplay failed:", e); }
          }

          try {
            await video.play();
          } catch (e) {
            console.warn("Promo video autoplay failed:", e);
            finishCurrentPromo();
          }
        };

        video.onloadedmetadata = startPlayback;
        video.onended = finishCurrentPromo;
        video.onerror = finishCurrentPromo;

        // Veiligheidsnet voor corrupte of vastgelopen trailers.
        schedulePromoAdvance(finishCurrentPromo, 5 * 60 * 1000);
      }

      function showNextPromo() {
        hideAllPromoMedia();

        if (promoCursor >= slides.length) {
          promoCursor = 0;
          showPlanningScreen("agenda");
          return;
        }

        const src = slides[promoCursor];
        promoCursor += 1;
        shownInBlock += 1;
        finishing = false;

        if (isVideoPromo(src)) showVideo(src);
        else showImage(src);
      }

      showNextPromo();
    }

    function initMainRotation() {
      if (!ENABLE_MAIN_ROTATION) return;
      startRotationWatchdog();
      showPlanningScreen("agenda");
    }

    // ─── NACHTELIJKE RELOAD ────────────────────────────────────────────────────

    function scheduleNightReload() {
      const now    = new Date();
      const reload = new Date();
      reload.setHours(NIGHT_RELOAD_H, 0, 0, 0);
      if (reload <= now) reload.setDate(reload.getDate() + 1);
      // FIX: location.reload() zonder argument (true is deprecated in moderne browsers)
      setTimeout(() => location.reload(), reload.getTime() - now.getTime());
    }

    // ─── OPSTARTEN ─────────────────────────────────────────────────────────────

    setScaleToFit();
    window.addEventListener("resize", setScaleToFit);

    scheduleNightReload();
    refreshAll();                 // laadt ook promo alvast op de achtergrond
    setInterval(refreshAll, REFRESH_MS);
    initMainRotation();
  </script>
</body>
</html>
