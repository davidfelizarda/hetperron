from pathlib import Path

content = """name: Build promo.json

on:
  push:
    paths:
      - "docs/promo/**"
      - ".github/workflows/build-promo-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate promo.json
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const promoDir = path.join(process.cwd(), 'docs', 'promo');
          const exts = new Set(['.jpg', '.jpeg', '.png', '.webp', '.gif', '.mp4', '.webm']);
          const videoExts = new Set(['.mp4', '.webm']);

          function promoParts(name) {
            const match = name.match(/^(\\d{4}-\\d{2}-\\d{2})_(\\d{4}-\\d{2}-\\d{2})_(.+)\\.([^.]+)$/i);
            if (!match) {
              return {
                end: '9999-12-31',
                title: name,
                isVideo: videoExts.has(path.extname(name).toLowerCase())
              };
            }

            return {
              end: match[2],
              title: match[3],
              isVideo: videoExts.has(path.extname(name).toLowerCase())
            };
          }

          const files = fs.readdirSync(promoDir, { withFileTypes: true })
            .filter(d => d.isFile())
            .map(d => d.name)
            .filter(name => exts.has(path.extname(name).toLowerCase()))
            .sort((a, b) => {
              const A = promoParts(a);
              const B = promoParts(b);

              // 1. Eerstvolgende voorstellings-/einddatum eerst
              const byEnd = A.end.localeCompare(B.end);
              if (byEnd) return byEnd;

              // 2. Zelfde datum: groepeer dezelfde voorstelling/titel
              const byTitle = A.title.localeCompare(B.title, 'nl', {
                numeric: true,
                sensitivity: 'base'
              });
              if (byTitle) return byTitle;

              // 3. Zelfde titel: afbeelding vóór video
              if (A.isVideo !== B.isVideo) return A.isVideo ? 1 : -1;

              return a.localeCompare(b, 'nl', {
                numeric: true,
                sensitivity: 'base'
              });
            })
            .map(name => `promo/${name}`);

          fs.writeFileSync(
            path.join(promoDir, 'promo.json'),
            JSON.stringify(files, null, 2)
          );
          NODE

      - name: Commit promo.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/promo/promo.json
          git diff --cached --quiet || git commit -m "update promo.json"
          git push
"""

out = Path("/mnt/data/build-promo-json-sorted.yml")
out.write_text(content, encoding="utf-8")
print(f"Klaar: {out.name}")
